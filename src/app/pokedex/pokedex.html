<h1>Pokedex - Listado de pokemon</h1>

<h2>Tenemos informacion disponible de {{this.pokemons.count}} pokemons</h2>
<h3>Mostrando informacion de los primeros {{conteo}} pokemon</h3>

<ol>
<!--Mostrar for de pokemons-->
@for (pokemon of pokemons.results; track $index) {

        <a href={{pokemon.url}}>{{pokemon.name}}</a>
        <!-- <app-pokemon [url]="pokemon.url" /> -->
    </li>
}
</ol>
